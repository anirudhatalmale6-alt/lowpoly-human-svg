  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Outfit',sans-serif;
    color:#333;
  }
  .page-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
  }
  .title-block{
    text-align:center;
    margin-bottom:20px;
  }
  .title-block h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:300;
    font-size:clamp(1.2rem,2.5vw,1.8rem);
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:#555;
  }
  .title-block .subtitle{
    font-weight:200;
    font-size:0.65rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:#bbb;
    margin-top:4px;
  }
  .svg-container{
    width:clamp(340px,55vw,520px);
  }
  .svg-container svg{
    width:100%;
    height:auto;
    display:block;
  }
  .facet{
    fill:none;
    stroke:#4a4a4a;
    stroke-width:0.9;
    stroke-linejoin:round;
    transition:fill 0.2s ease, stroke 0.2s ease;
    cursor:pointer;
  }
  .facet:hover{
    fill:rgba(100,100,100,0.05);
    stroke:#333;
    stroke-width:1.1;
  }
  .facet.active{
    fill:rgba(80,80,80,0.08);
    stroke:#222;
    stroke-width:1.3;
  }
  .tooltip{
    position:fixed;
    pointer-events:none;
    background:rgba(255,255,255,0.96);
    border:1px solid #ddd;
    color:#666;
    font-weight:300;
    font-size:0.6rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:2px;
    opacity:0;
    transition:opacity 0.15s ease;
    z-index:100;
    white-space:nowrap;
  }
  .tooltip.visible{opacity:1}
  .footer-label{
    color:#ccc;
    font-size:0.5rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    margin-top:14px;
    font-weight:200;
  }
</style>

<div class="tooltip" id="tooltip"></div>
<script>
(function(){
  const tooltip = document.getElementById('tooltip');
  let active = null;
  document.querySelectorAll('.facet').forEach(f => {
    f.addEventListener('mouseenter', () => {
      tooltip.textContent = f.getAttribute('data-region');
      tooltip.classList.add('visible');
    });
    f.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 8) + 'px';
    });
    f.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
    f.addEventListener('click', e => {
      e.stopPropagation();
      if(active) active.classList.remove('active');
      if(active === f){ active = null; return; }
      f.classList.add('active');
      active = f;
    });
  });
  document.addEventListener('click', () => {
    if(active){ active.classList.remove('active'); active = null; }
  });
})();
</script>
